server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: any unknown path falls back to index.html so React Router can handle it
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed static assets produced by Vite
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
